<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <!-- Lil Stars brick wall tile (seamless). Rounded grape bricks, dark mortar, soft top bevel. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f66"/>
      <stop offset="1" stop-color="#2a2150"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43367a"/>
      <stop offset="1" stop-color="#30265a"/>
    </linearGradient>
    <g id="brick">
      <rect x="0" y="0" width="114" height="34" rx="9" fill="url(#b)"/>
      <rect x="6" y="3" width="102" height="5" rx="2.5" fill="#ffffff" opacity="0.07"/>
    </g>
    <g id="brickL">
      <rect x="0" y="0" width="114" height="34" rx="9" fill="url(#b2)"/>
      <rect x="6" y="3" width="102" height="5" rx="2.5" fill="#ffffff" opacity="0.08"/>
    </g>
  </defs>
  <rect width="240" height="160" fill="#15122a"/>
  <!-- row 1 -->
  <use href="#brick" x="3" y="3"/>
  <use href="#brickL" x="123" y="3"/>
  <!-- row 2 (offset half a brick, wraps across the edge) -->
  <use href="#brickL" x="-57" y="43"/>
  <use href="#brick" x="63" y="43"/>
  <use href="#brickL" x="183" y="43"/>
  <!-- row 3 -->
  <use href="#brickL" x="3" y="83"/>
  <use href="#brick" x="123" y="83"/>
  <!-- row 4 -->
  <use href="#brick" x="-57" y="123"/>
  <use href="#brickL" x="63" y="123"/>
  <use href="#brick" x="183" y="123"/>
  <!-- chalk graffiti stars and a sparkle -->
  <path d="M86 92 l3.2 6.6 7.2 1 -5.2 5 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.2 -5 7.2 -1z" fill="none" stroke="#e826b1" stroke-width="2" stroke-linejoin="round" opacity="0.35"/>
  <path d="M190 12 l2.2 4.5 5 .7 -3.6 3.5 .9 5 -4.5 -2.4 -4.5 2.4 .9 -5 -3.6 -3.5 5 -.7z" fill="none" stroke="#ffb84d" stroke-width="1.8" stroke-linejoin="round" opacity="0.32"/>
  <path d="M30 136 v8 M26 140 h8" stroke="#ffd27a" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
