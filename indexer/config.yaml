# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: star-raid-indexer
description: Star Raid raids, seats, buys, wall fills and leaderboards
contracts:
  - name: RaidVault
    abi_file_path: abis/RaidVault.json
    events:
      - event: Posted
      - event: Opened
      - event: Aborted
      - event: CloseRequested
      - event: EndDrawn
      - event: Settled
      - event: WallRecovered
      - event: RolloverCredited
  - name: RaidRouter
    abi_file_path: abis/RaidRouter.json
    events:
      - event: Raided
      - event: PrizeFunded
      - event: Claimed
      - event: ExitedEarly
  - name: SeatGate
    abi_file_path: abis/SeatGate.json
    events:
      - event: SeatBound
  # Kuru markets are registered from Posted (terms.market). Only fills whose maker is one of our
  # WallMaker clones become WallFill rows; every other Trade on the market is ignored.
  - name: KuruOrderBook
    abi_file_path: abis/KuruOrderBook.json
    events:
      - event: Trade
chains:
  # Monad testnet, deployed 6 Oct 2026 (deployments/testnet.json).
  - id: 10143
    start_block: 68548970
    contracts:
      - name: RaidVault
        address: "0xE4C81a5717bb9E4b8C2FF87a96AcA56FA2480E89"
      - name: RaidRouter
        address: "0x653363d9EfE33898DB7948FB78EB30c43e0B8498"
      - name: SeatGate
        address: "0xc2aB9E8b765730bd8E540810a9fC937c7BA89472"
      - name: KuruOrderBook
